name: Build, release and deploy Astra AI

on:
  push:
    branches: [main]
    paths:
      - ".astra_source/**"
      - "android/**"
      - "site/**"
      - ".github/workflows/bootstrap-astra.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: astra-bootstrap
  cancel-in-progress: false

jobs:
  restore-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore source archive from staged parts (first run only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .astra_source ]] && compgen -G ".astra_source/chunk-*" > /dev/null; then
            mkdir -p "$RUNNER_TEMP/astra-extract"
            cat .astra_source/chunk-* > "$RUNNER_TEMP/astra-project.zip.b64"
            base64 --decode "$RUNNER_TEMP/astra-project.zip.b64" > "$RUNNER_TEMP/astra-project.zip"
            unzip -t "$RUNNER_TEMP/astra-project.zip"
            unzip -q "$RUNNER_TEMP/astra-project.zip" -d "$RUNNER_TEMP/astra-extract"
            test -d "$RUNNER_TEMP/astra-extract/astra-ai-github"
            cp -a "$RUNNER_TEMP/astra-extract/astra-ai-github/." .
            rm -f .github/workflows/build-astra-ai-apk.yml .github/workflows/deploy-astra-ai-pages.yml
            rm -rf .astra_source "$RUNNER_TEMP/astra-extract" "$RUNNER_TEMP/astra-project.zip" "$RUNNER_TEMP/astra-project.zip.b64"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Add Astra AI Android and website source"
              git push origin HEAD:main
            fi
          else
            echo "Astra AI source is already restored; continuing with build."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use the preinstalled Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Astra-AI.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astra-AI-Android-APK
          path: ${{ runner.temp }}/Astra-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Astra AI v1.0.${{ github.run_number }}
          body: |
            Astra AI Android app release.
            Install the APK manually and enter your own Gemini API key in Settings.
            New APK versions are checked from inside the app using Check updates.
          files: ${{ runner.temp }}/Astra-AI.apk
          make_latest: true
          generate_release_notes: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
